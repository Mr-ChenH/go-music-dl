{{define "search_box"}}
<div id="react-search-root"
     data-root="{{.Root}}"
     data-current-path="{{.CurrentPath}}"
     data-collection-name="{{.ColName}}"
     data-keyword="{{.Keyword}}"
     data-search-type="{{if eq .SearchType "local_music"}}song{{else}}{{.SearchType}}{{end}}"
     data-placeholder="{{.SearchPlaceholder}}"
     data-page-size="{{.PageSize}}"
     data-error="{{.Error}}"
     data-sources='{{tojson .AllSources}}'
     data-defaults='{{tojson .DefaultSources}}'
     data-selected='{{tojson .Selected}}'
     data-descriptions='{{tojson .SourceDescriptions}}'
     data-playlist-supported='{{tojson .PlaylistSupported}}'
     data-album-supported='{{tojson .AlbumSupported}}'
     data-category-supported='{{tojson .CategorySupported}}'
     data-user-playlist-supported='{{tojson .UserPlaylistSupported}}'>
</div>

<noscript>
<div class="search-box">
    <h1><a href="https://github.com/guohuiyuan/go-music-dl">music-dl</a></h1>
    <form action="{{.Root}}/search" method="get" id="search-form">
        <input type="hidden" name="page" value="1">
        <input type="hidden" name="page_size" id="page-size-hidden" value="{{.PageSize}}">
        <div class="search-type-switch">
            <label class="type-option"><input type="radio" name="type" value="song" {{if or (eq .SearchType "song") (eq .SearchType "local_music") (not .SearchType)}}checked{{end}} onchange="toggleSearchType(this.value)"><span>单曲搜索</span></label>
            <label class="type-option"><input type="radio" name="type" value="playlist" {{if eq .SearchType "playlist"}}checked{{end}} onchange="toggleSearchType(this.value)"><span>歌单搜索</span></label>
            <label class="type-option"><input type="radio" name="type" value="album" {{if eq .SearchType "album"}}checked{{end}} onchange="toggleSearchType(this.value)"><span>专辑搜索</span></label>
        </div>
        <div class="input-group">
            <input type="text" id="search-keyword" name="q" value="{{.Keyword}}" placeholder="{{.SearchPlaceholder}}" required autocomplete="off">
            <button type="submit" class="search-btn">搜索</button>
        </div>
        <div class="quick-actions">
            <button type="button" class="btn-pill btn-pill-primary" onclick="goToRecommend()">每日推荐歌单</button>
            <button type="button" class="btn-pill btn-pill-fav" onclick="openCollectionManager()">本地歌单</button>
            <button type="button" class="btn-pill btn-pill-fav" onclick="openLocalMusicPage()">本地音乐</button>
            <button type="button" class="btn-pill btn-pill-category" onclick="goToPlaylistCategories()">歌单分类</button>
            <button type="button" class="btn-pill btn-pill-mine" onclick="goToUserPlaylists()">我的歌单</button>
        </div>
        {{if .Error}}<div class="error-msg">{{.Error}}</div>{{end}}
        <div class="source-selector" id="source-selector">
            <div class="source-header">
                <button type="button" class="source-collapse-btn" onclick="toggleSourceSelector()" aria-expanded="true" aria-controls="source-grid">
                    <span class="source-title">搜索源设置</span>
                    <i class="fa-solid fa-chevron-up source-collapse-icon" aria-hidden="true"></i>
                </button>
                <div class="source-actions">
                    <button type="button" class="ctrl-btn" id="btn-all">全选</button>
                    <button type="button" class="ctrl-btn" id="btn-none">清空</button>
                </div>
            </div>
            <div class="source-grid" id="source-grid">
                {{range $source := .AllSources}}
                <label>
                    <input type="checkbox" name="sources" value="{{$source}}" class="source-checkbox"
                           data-playlist-supported="{{index $.PlaylistSupported $source}}"
                           data-album-supported="{{index $.AlbumSupported $source}}"
                           data-category-supported="{{index $.CategorySupported $source}}"
                           data-user-playlist-supported="{{index $.UserPlaylistSupported $source}}">
                    <span class="source-card"><span class="source-name">{{$source}}</span><span class="source-desc">{{index $.SourceDescriptions $source}}</span></span>
                </label>
                {{end}}
            </div>
        </div>
    </form>
</div>
</noscript>
{{end}}
